function resetDate(input){

function update(data){

 rings.forEach(ring=>{
  const key=ring.key,input=data[key==='five'?'fiveHourRemainingPercent':'weeklyRemainingPercent'];
  const value=typeof input==='number'&&Number.isFinite(input)?Math.max(0,Math.min(100,input)):null;

  $(key+'Value').textContent=value===null?'--':Math.round(value)+'%';
  const tone=value!==null&&value<=10?'#e3aaa1':value!==null&&value<=20?'#ddbf9d':key==='five'?'#282e35':'#a1aab4';$(key+'Arc').style.stroke=tone;$(key+'Value').style.color='';
 });
 cat.quota=typeof data.fiveHourRemainingPercent==='number'?data.fiveHourRemainingPercent:50;
 resumeFlow();
 const fiveEnd=resetDate(data.fiveHourResetsAt),weekEnd=resetDate(data.weeklyResetsAt);
 $('fiveReset').textContent='5h '+(fiveEnd?fiveEnd.toLocaleTimeString('zh-CN',{hour12:false,hourCycle:'h23',hour:'2-digit',minute:'2-digit'}):'--:--');
 $('weekReset').textContent='本周 '+(weekEnd?String(weekEnd.getMonth()+1).padStart(2,'0')+'/'+String(weekEnd.getDate()).padStart(2,'0'):'--/--');
 const fullTime=date=>date?date.toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'未知';
 const ending='5h 结束于 '+fullTime(fiveEnd)+'，本周结束于 '+fullTime(weekEnd);
 $('resetTimes').title=ending+'（本地时间）'+(data.error?'\n'+data.error:'');
 $('resetTimes').setAttribute('aria-label',$('resetTimes').title);
 widget.setAttribute('aria-label',`官方 Codex 额度：5 小时剩余 ${$('fiveValue').textContent}，本周剩余 ${$('weekValue').textContent}。${ending}。拖动移动，右键菜单。`);
}
async function sync(){
 if(busy)return;
 if(location.protocol==='file:'){update({syncStatus:'error',error:'请运行 Orbitlet.exe，并从右键菜单打开实时预览。'});return;}

 try{const response=await fetch('/api/quota',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('unavailable');update(await response.json());}
 catch{update({...last,syncStatus:'error',error:'本地连接已断开；请确认 Orbitlet 正在运行。'});}
 finally{clearTimeout(timeout);busy=false;}
}

function open(x,y){close();menu.classList.add('open');menu.style.left=Math.max(8,Math.min(x,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=Math.max(8,Math.min(y,innerHeight-menu.offsetHeight-8))+'px'}
widget.addEventListener('contextmenu',e=>{e.preventDefault();open(e.clientX,e.clientY)});document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target))close()});

const kitty=$('miniCat'),cat={x:0,y:0,size:28,width:134.5,height:134.5,action:'balance',started:0,right:true,contact:50,quota:75,obstacles:[],last:0,frame:0,mode:'perch',fx:0,fy:0,vx:0,vy:0,angle:-Math.PI/2,speed:0,time:0,remainder:0,deadline:.85,grip:true,first:true,pending:'',climbTarget:-Math.PI/2,compression:0,compressionV:0,gait:0,now:0};

function catSafe(x,y){const h=cat.size*28/32;return x>=4&&y>=4&&x+cat.size<=cat.width-4&&y+h<=cat.height-4&&!cat.obstacles.some(r=>x<=r.x+r.w&&x+cat.size>=r.x&&y<=r.y+r.h&&y+h>=r.y);}
function catPose(action){if(cat.action!==action){cat.action=action;cat.started=cat.now;}}
function configureCat(){
 const small=widget.classList.contains('small'),scale=small?.42:.48,labelHeight=small?30:34,labelWidth=small?46:52;

 cat.cx=cat.width/2;cat.cy=(small?19:23)+112*scale;cat.radius=96*scale;
 cat.obstacles=[{x:cat.cx-labelWidth/2,y:cat.cy-labelHeight/2-2,w:labelWidth,h:labelHeight+4},{x:cat.cx-23,y:(small?86:104)-2,w:46,h:23}];
 Object.assign(cat,{fx:cat.cx,fy:cat.cy-cat.radius,vx:0,vy:0,angle:-Math.PI/2,speed:0,time:0,remainder:0,deadline:.85,grip:true,first:true,pending:'',mode:'perch',compression:0,compressionV:0,action:'balance',right:true,contact:50});

}
function releaseCat(direction){cat.right=direction>0;cat.mode='rail';cat.grip=false;cat.speed=direction*9;cat.vx=-Math.sin(cat.angle)*cat.speed;cat.vy=Math.cos(cat.angle)*cat.speed;catPose('slide');cat.deadline=cat.time+5;}

function groundIntention(){
 const right=cat.fx>cat.cx,half=cat.size/2;
 if(Math.random()<.28){const data=cat.obstacles[1],lo=right?data.x+data.w+half+1:4+half,hi=right?cat.width-4-half:data.x-half-1;cat.walkTarget=lo+Math.random()*Math.max(0,hi-lo);cat.pendingFacing=cat.walkTarget>=cat.fx;cat.pending='walk';}
 else{const angle=right?-Math.PI/4:-3*Math.PI/4,tx=cat.cx+Math.cos(angle)*cat.radius,ty=cat.cy+Math.sin(angle)*cat.radius,rise=cat.fy-ty,vy=-Math.sqrt(2*catGravity*(Math.max(0,rise)+6)),flight=(-vy+Math.sqrt(Math.max(0,vy*vy-2*catGravity*rise)))/catGravity;cat.impulseX=(tx-cat.fx)/Math.max(.1,flight);cat.impulseY=vy;cat.pendingFacing=!right;cat.pending='jump';}

function catRailStep(dt){

function catCollisions(){
 const half=cat.size/2,height=cat.size*28/32,floor=cat.height-6;

}
function catSimulate(dt){

   else if(!cat.first&&Math.abs(cat.angle+Math.PI/2)<.15&&Math.random()<.3){cat.climbTarget=(135+270*Math.max(35,Math.min(65,cat.quota))/100-360)*Math.PI/180;cat.grip=true;cat.mode='rail';cat.speed=0;catPose('climb');}
   else{const direction=cat.first?1:cat.angle<-Math.PI/2?-1:cat.angle>-Math.PI/2?1:Math.random()<.5?-1:1;cat.first=false;if(cat.right!==(direction>0)){cat.pending=direction>0?'release-right':'release-left';catPose('turn');cat.deadline=cat.time+.22;}else releaseCat(direction);}
  }
 }else if(cat.mode==='rail')catRailStep(dt);else if(cat.mode==='air')catAirStep(dt);
 else{let desired=0;if(cat.pending==='walk'&&cat.action==='walk'){desired=Math.max(-16,Math.min(16,(cat.walkTarget-cat.fx)*6));if(Math.abs(cat.walkTarget-cat.fx)<.5&&Math.abs(cat.vx)<2)restCat();}cat.vx+=((desired-cat.vx)*18-3*cat.vx)*dt;cat.fx+=cat.vx*dt;cat.gait+=Math.abs(cat.vx)*dt;if(cat.time>=cat.deadline){if(cat.action==='turn')startGroundIntention();else if(cat.action==='land'||cat.action==='walk')restCat();else groundIntention();}}
 catCollisions();cat.x=cat.fx-cat.size/2;cat.y=cat.fy-cat.size*28/32;
}
function tickCat(now,elapsed){cat.now=now;cat.remainder+=Math.min(.075,Math.max(0,elapsed));while(cat.remainder>=catStep){catSimulate(catStep);cat.remainder-=catStep;}}

const catPhoto=new Image();let catPhotoReady=false,catPhotoFrames=[];
const catPhotoLoaded=new Promise((resolve,reject)=>{catPhoto.onload=resolve;catPhoto.onerror=reject;});
catPhoto.src='/assets/cat-real-atlas.png';
Promise.all([fetch('/assets/cat-real-atlas.json').then(response=>{if(!response.ok)throw Error('Cat frames unavailable');return response.json();}),catPhotoLoaded]).then(([atlas])=>{
 catPhotoFrames=atlas.frames;catPhotoReady=catPhotoFrames.length===12;kitty.dataset.assetStatus=catPhotoReady?'ready':'error';drawCat(performance.now()/1000);
}).catch(()=>{kitty.dataset.assetStatus='error';});
function drawCat(now){
 const action=reduced.matches?'sit':cat.action,age=Math.max(0,now-cat.started);
 kitty.style.left=cat.x+'px';kitty.style.top=cat.y+'px';kitty.dataset.action=action;kitty.dataset.contact=cat.contact===null?'':String(cat.contact);
 $('catContact').setAttribute('d',cat.contact===null?'':segment(96,Math.max(0,cat.contact-2.5),Math.min(100,cat.contact+2.5)));
 const context=kitty.getContext('2d'),width=kitty.width,height=kitty.height;context.clearRect(0,0,width,height);
 if(!catPhotoReady)return;
 let frame=action==='walk'||action==='climb'?Math.floor(cat.gait/(cat.size*.45)*4)%4:action==='hop'?0:action==='sit'||action==='balance'?5:action==='groom'||action==='paw'?6+Math.floor(age*3)%2:action==='stretch'?8:action==='sniff'||action==='slide'||action==='land'?9:action==='nap'?10:4;
 kitty.dataset.frame=String(frame);kitty.dataset.mode=cat.mode;kitty.dataset.vx=cat.vx.toFixed(3);kitty.dataset.vy=cat.vy.toFixed(3);
 const [sx,sy,sw,sh]=catPhotoFrames[frame],scale=Math.min((width-6)/345,(height-6)/327,(width-6)/sw);
 const dw=sw*scale*(1+cat.compression*.04),dh=sh*scale*(1-cat.compression*.18);
 context.save();if(cat.mode==='ground'){context.fillStyle='rgba(30,40,50,.07)';context.beginPath();context.ellipse(width/2,height-5,width*.22,3,0,0,Math.PI*2);context.fill();}
 context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';if(!cat.right){context.translate(width,0);context.scale(-1,1);}
 context.drawImage(catPhoto,sx,sy,sw,sh,(width-dw)/2,height-dh-3,dw,dh);context.restore();
}
function catActive(){return !document.hidden&&!widget.hidden&&!widget.classList.contains('folded')&&!reduced.matches;}
function catFrame(ms){cat.frame=0;if(!catActive())return;const now=ms/1000;if(ms-cat.last>=32){tickCat(now,(ms-cat.last)/1000);drawCat(now);cat.last=ms;}cat.frame=requestAnimationFrame(catFrame);}
function resumeCat(){if(cat.frame)cancelAnimationFrame(cat.frame);cat.frame=0;cat.last=performance.now();drawCat(cat.last/1000);if(catActive())cat.frame=requestAnimationFrame(catFrame);}
new ResizeObserver(configureCat).observe(widget);
new MutationObserver(resumeCat).observe(widget,{attributes:true,attributeFilter:['hidden','class']});
document.addEventListener('visibilitychange',resumeCat);reduced.addEventListener('change',resumeCat);configureCat();

sync();setInterval(()=>{if(!document.hidden)sync()},5000);document.addEventListener('visibilitychange',()=>{resumeFlow();if(!document.hidden)sync()});
})();
</script></body></html>
